<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abriendo · Chirp</title>
  <script>
  (function () {
    const parts = (location.pathname || '').split('/').filter(Boolean);
    const segment = index => {
      try { return decodeURIComponent(parts[index] || ''); }
      catch (_) { return ''; }
    };
    if (parts[0] === 'profile' && parts[1]) {
      location.replace('/u.html?username=' + encodeURIComponent(segment(1)));
      return;
    }
    if (parts.length === 1 && parts[0] === 'profile') {
      location.replace('/profile.html');
      return;
    }
    if (parts[0] === 'chirp' && parts[1]) {
      location.replace('/chirp.html?id=' + encodeURIComponent(segment(1)));
      return;
    }
    if (parts[0] === 'embed') {
      location.replace('/embed.html' + (parts[1] ? '?chirp=' + encodeURIComponent(segment(1)) : (location.search || '')));
      return;
    }
    if (parts[0] === 'u' && parts[1]) {
      location.replace('/u.html?username=' + encodeURIComponent(segment(1)));
      return;
    }
    if (parts.length === 1 && parts[0] && !parts[0].includes('.')) {
      location.replace('/u.html?username=' + encodeURIComponent(segment(0)));
      return;
    }
    location.replace('/home.html');
  })();
  </script>
</head>
<body>Abriendo Chirp…</body>
</html>
